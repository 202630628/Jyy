<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>오늘 뭐 보지? - 영화 추천</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>🎬 오늘의 영화 추천</h1>
        <p class="subtitle">오늘 밤 어떤 영화를 볼지 고민되시나요?</p>

        <!-- 영화 결과 출력 영역 -->
        <div class="movie-card">
            <span class="genre" id="movie-genre">장르</span>
            <h2 id="movie-title">버튼을 눌러보세요!</h2>
        </div>

        <!-- 버튼 영역 -->
        <div class="btn-group">
            <button id="recommend-btn" onclick="recommendMovie()">🎲 영화 추천받기</button>
            <button id="select-btn" onclick="selectMovie()" disabled>✅ 이 영화로 결정!</button>
        </div>

        <!-- 선택 결과 메시지 -->
        <div id="final-choice" class="hidden">
            <p>🎉 오늘 볼 영화는 <strong id="selected-title"></strong>입니다! 즐거운 감상 되세요!</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
